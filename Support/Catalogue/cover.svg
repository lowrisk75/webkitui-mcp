<svg xmlns="http://www.w3.org/2000/svg" width="768" height="403.2" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">WebKitUI MCP — Native WebKit for Mac</title>
  <desc id="desc">Promotional illustration. Your agent. A native Mac browser. You stay in control. Requires macOS 15 or later and Apple silicon. Developer Preview.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a29"/><stop offset="1" stop-color="#101f26"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#9ae6cb"/><stop offset="1" stop-color="#7cc9f5"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <rect x="64" y="57" width="40" height="40" rx="12" fill="url(#accent)"/>
    <path d="M73 72l6 14 5-10 5 10 6-14" fill="none" stroke="#132337" stroke-width="3" stroke-linejoin="round"/>
    <text x="120" y="86" font-size="26" font-weight="650" fill="#f2f7fa">WebKitUI MCP</text>
    <text x="64" y="205" font-size="60" font-weight="700" fill="#f2f7fa">Your agent.</text>
    <text x="64" y="279" font-size="60" font-weight="700" fill="#f2f7fa">A native Mac browser.</text>
    <text x="64" y="353" font-size="60" font-weight="700" fill="url(#accent)">You stay in control.</text>
    <text x="66" y="421" font-size="24" fill="#bdcbd5">Persistent sign-ins · Native approval · Human handoff</text>
